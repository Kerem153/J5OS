name: J5OS MultiBoot
on:
  push:
    paths:
      - 'multiboot/**'
      - '.github/workflows/multiboot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: python multiboot/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: J5OS-MultiBoot
          path: dist/*.zip
